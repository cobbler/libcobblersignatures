name: Publish to PyPI

on: [push]

jobs:
  build-n-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'pypi' || 'testpypi' }}
      url: ${{ startsWith(github.ref, 'refs/tags/v') && 'https://pypi.org/p/libcobblersignatures' || 'https://test.pypi.org/p/libcobblersignatures' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.9
      - name: Update package cache
        run: sudo apt-get -yq update
      - name: Install Deps for installing project
        run: pip install Sphinx coverage wheel setuptools_scm
      - name: Pin version without local part
        # PyPI/TestPyPI reject uploads whose version has a local segment
        # (e.g. "+gabcdef"), which setuptools_scm appends for non-tag commits.
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=$(python -m setuptools_scm | cut -d'+' -f1)" >> $GITHUB_ENV
      - name: Install Deps with pip
        run: pip install .
      - name: Install pypa/build
        run: python -m pip install build --user
      - name: Build a binary wheel and a source tarball
        run: python -m build
      - name: Publish distribution to Test PyPI
        if: github.ref == 'refs/heads/main'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish distribution to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
