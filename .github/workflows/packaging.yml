name: Building libcobblersignatures packages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-opensuse-leap-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install System dependencies
        run: sudo apt-get install -y rename
      - name: Build a openSUSE Leap 16 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/rpms/build-and-install-rpms.sh opensuse-leap docker/rpms/openSUSE_Leap/openSUSE_Leap.dockerfile
      - name: Rename RPM
        run: |
          file-rename -v -d -e 's/libcobblersignatures-(.+)-0\.(\w+)\.rpm/libcobblersignatures-$1-0.leap.$2.rpm/' rpm-build/*.rpm
      - name: Archive RPMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms-opensuse-leap
          path: |
            rpm-build/*.rpm

  build-opensuse-tumbleweed-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install System dependencies
        run: sudo apt-get install -y rename
      - name: Build a openSUSE Tumbleweed Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/rpms/build-and-install-rpms.sh opensuse-tumbleweed docker/rpms/openSUSE_Tumbleweed/openSUSE_TW.dockerfile
      - name: Rename RPM
        run: |
          file-rename -v -d -e 's/libcobblersignatures-(.+)-0\.(\w+)\.rpm/libcobblersignatures-$1-0.tw.$2.rpm/' rpm-build/*.rpm
      - name: Archive RPMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms-opensuse-tumbleweed
          path: |
            rpm-build/*.rpm

  build-debian-debs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build a Debian 13 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/debs/build-and-install-debs.sh deb13 docker/debs/debian/Debian13.dockerfile
      - name: Archive DEBs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debs-debian
          path: |
            deb-build/*.deb
      - name: Attach .deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: deb-build/*.deb
